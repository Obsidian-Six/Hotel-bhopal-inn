services:
  backend:
    build: ./backend
    container_name: hotel-bhopal-backend
    env_file:
      - ./backend/.env
    volumes:
      - /var/www/hotel-data/uploads:/app/uploads
    networks:
      - web-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hotel-bhopal-backend.rule=Host(`api.hotelbhopalinn.com`)"
      - "traefik.http.routers.hotel-bhopal-backend.entrypoints=websecure"
      - "traefik.http.routers.hotel-bhopal-backend.tls.certresolver=myresolver"
      - "traefik.http.services.hotel-bhopal-backend.loadbalancer.server.port=8000"
    restart: always

  frontend:
    build: ./frontend
    container_name: hotel-bhopal-frontend
    depends_on:
      - backend
    networks:
      - web-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hotel-bhopal-frontend.rule=Host(`hotelbhopalinn.com`) || Host(`www.hotelbhopalinn.com`)"
      - "traefik.http.routers.hotel-bhopal-frontend.entrypoints=websecure"
      - "traefik.http.routers.hotel-bhopal-frontend.tls.certresolver=myresolver"
      - "traefik.http.services.hotel-bhopal-frontend.loadbalancer.server.port=80"
    restart: always

networks:
  web-proxy:
    external: true