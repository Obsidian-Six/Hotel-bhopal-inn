version: '3.8'

services:
  backend:
    build: ./backend
    container_name: hotel-bhopal-backend
    env_file:
      - ./backend/.env
    volumes:
      - /var/www/hotel-data/uploads:/app/uploads
    networks:
      - web-proxy  # Added this to talk to your global Traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.hotelbhopalinn.tenontenstays.com`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=myresolver"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
    restart: always

  frontend:
    build: ./frontend
    container_name: hotel-bhopal-frontend
    depends_on:
      - backend
    networks:
      - web-proxy  # Added this
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`hotelbhopalinn.tenontenstays.com`) || Host(`www.hotelbhopalinn.tenontenstays.com`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=myresolver"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
    restart: always

networks:
  web-proxy:
    external: true